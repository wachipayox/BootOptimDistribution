name: Validate revision domain

on:
  pull_request:
    branches: [agent/integration-current]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/revision/**'
      - '.github/workflows/pr-domain.yml'

permissions:
  contents: read

jobs:
  revision-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l internal/revision)"
      - name: Focused tests
        run: go test ./internal/revision
