name: Build deployable distribution service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: go test ./...
      - name: Build Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -buildvcs=false -o dist/bootoptim-distribution ./cmd/bootoptim-distribution
      - name: Publish deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootoptim-distribution-linux-amd64-${{ github.sha }}
          path: dist/bootoptim-distribution
          if-no-files-found: error
