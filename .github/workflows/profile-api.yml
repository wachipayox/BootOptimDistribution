name: Profile API checks

on:
  pull_request:
    branches: [agent/integration-current]
    paths:
      - 'internal/profileapi/**'
      - 'internal/storage/profile_api.go'
      - '.github/workflows/profile-api.yml'

permissions:
  contents: read

jobs:
  profile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Download modules
        run: go mod download
      - name: gofmt
        run: test -z "$(gofmt -l internal/profileapi internal/storage/profile_api.go)"
      - name: Focused tests
        run: go test ./internal/profileapi ./internal/storage
